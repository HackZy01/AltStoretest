name: Build Unsigned IPA

# Builds the AltStore iOS app and packages it as an unencrypted, unsigned .ipa.
# "Unencrypted" here means it never goes through Apple's App Store signing/
# FairPlay pipeline — the archive is built with code signing disabled and the
# .app is packaged directly into a Payload/ folder. You (or a tool like
# AltStore/Sideloadly/altsign) are responsible for signing it before install.

on:
  push:
    branches: [ marketplace ]
  pull_request:
    branches: [ marketplace ]
  workflow_dispatch: {}

env:
  SCHEME: AltStore
  WORKSPACE: AltStore.xcworkspace
  CONFIGURATION: Release
  # iOS only, so exclude the AltServer (macOS) destination that ships in the same workspace
  DESTINATION: "generic/platform=iOS"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME"

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -archivePath "$RUNNER_TEMP/AltStore.xcarchive" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -archivePath "$RUNNER_TEMP/AltStore.xcarchive" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned, unencrypted IPA
        run: |
          set -e
          ARCHIVE_APP="$RUNNER_TEMP/AltStore.xcarchive/Products/Applications/AltStore.app"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"

          if [ ! -d "$ARCHIVE_APP" ]; then
            echo "::error::AltStore.app not found in archive at $ARCHIVE_APP"
            find "$RUNNER_TEMP/AltStore.xcarchive" -maxdepth 4
            exit 1
          fi

          mkdir -p "$PAYLOAD_DIR"
          cp -R "$ARCHIVE_APP" "$PAYLOAD_DIR/"

          # Strip any leftover signature so the IPA ships fully unsigned/unencrypted
          codesign --remove-signature "$PAYLOAD_DIR/AltStore.app" || true

          mkdir -p "$GITHUB_WORKSPACE/build"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/build/AltStore-unsigned.ipa" Payload)

          ls -lh "$GITHUB_WORKSPACE/build/AltStore-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-unsigned-ipa
          path: build/AltStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
